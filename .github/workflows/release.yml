name: Release

# Tag a commit and the release builds itself:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces Otium.zip and attaches it to a GitHub Release, which is what
# Scripts/install.sh downloads. Also runnable by hand from the Actions tab
# (without a tag it builds and uploads an artifact but publishes nothing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The tests are the gate, not a formality: they cover the engine, the
      # progression, the ledger and the wording of every user-facing string.
      - name: Run tests
        run: swift test

      - name: Build Otium.app
        env:
          OTIUM_SKIP_INSTALL: "1"        # a CI runner has no /Applications to own
        run: |
          # On a tag, the tag IS the version — the app must not be free to say
          # something else. Off a tag there is no version to claim.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export OTIUM_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./Scripts/build-app.sh

      # A bundle that cannot start is indistinguishable from a healthy one until
      # someone downloads it. Ask the binary itself before shipping it.
      - name: Verify the bundle
        run: |
          APP=dist/Otium.app
          test -x "$APP/Contents/MacOS/Otium"     || { echo "::error::no executable in the bundle"; exit 1; }
          test -f "$APP/Contents/Resources/Otium.icns" || { echo "::error::the bundle has no icon"; exit 1; }
          VERSION_SAID="$("$APP/Contents/MacOS/Otium" --version)"
          echo "the bundle says: ${VERSION_SAID}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
            grep -q "${EXPECTED}" <<< "${VERSION_SAID}" \
              || { echo "::error::tag says ${EXPECTED}, the binary says ${VERSION_SAID}"; exit 1; }
          fi

      - name: Zip it
        run: ditto -c -k --keepParent dist/Otium.app Otium.zip

      # Il DMG, per chi scarica a mano invece di usare l'installatore.
      #
      # Costruito qui dentro con `hdiutil` e non da uno strumento di sistema: un runner GitHub è
      # una macchina nuda, e un passo che dipende da qualcosa fuori dal repo è un passo che
      # funziona solo sul Mac di chi l'ha scritto.
      - name: Make the DMG
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "dist/Otium.app/Contents/Info.plist")"
          DMG="Otium-${VERSION}.dmg"
          STAGE="$(mktemp -d)"
          cp -R "dist/Otium.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Otium ${VERSION}" -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # Un DMG che si crea senza errori può contenere un bundle rotto, e la differenza si vede
          # solo montandolo. Meglio qui che nella cartella Download di chi lo scarica.
          MNT="$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)"
          # Si smonta SEMPRE, anche quando il controllo boccia: uscire prima del `detach` lascia un
          # volume montato in giro, e su una macchina che non è un runner usa-e-getta resta lì.
          trap 'hdiutil detach "$MNT" -quiet 2>/dev/null || true' EXIT
          test -x "$MNT/Otium.app/Contents/MacOS/Otium" \
            || { echo "::error::no executable inside the DMG"; exit 1; }
          codesign --verify --deep --strict "$MNT/Otium.app" \
            || { echo "::error::the signature does not hold inside the DMG"; exit 1; }
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "the DMG is $DMG"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otium
          path: Otium.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Otium.zip
            ${{ env.DMG }}
          generate_release_notes: true
